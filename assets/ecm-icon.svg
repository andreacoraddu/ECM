<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ECM Battery Modeling Icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f9ff"/>
      <stop offset="100%" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="batteryFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9dc3eb"/>
      <stop offset="100%" stop-color="#7eaee0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fc8a9"/>
      <stop offset="50%" stop-color="#9ec3ef"/>
      <stop offset="100%" stop-color="#d7a5d7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8aa4b8" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="390" fill="#ffffff" opacity="0.72"/>

  <g filter="url(#softShadow)">
    <rect x="282" y="240" width="420" height="520" rx="58" fill="#ffffff" stroke="#6f8699" stroke-width="18"/>
    <rect x="432" y="180" width="120" height="62" rx="20" fill="#6f8699"/>

    <rect x="326" y="310" width="332" height="340" rx="36" fill="url(#batteryFill)" opacity="0.95"/>

    <path d="M356 580 C408 520, 456 644, 512 580 C566 516, 614 638, 668 578"
          fill="none" stroke="url(#wave)" stroke-width="24" stroke-linecap="round"/>

    <path d="M356 495 C408 435, 456 559, 512 495 C566 431, 614 553, 668 493"
          fill="none" stroke="#f6d28b" stroke-width="18" stroke-linecap="round" opacity="0.92"/>

    <rect x="360" y="690" width="264" height="24" rx="12" fill="#8fa6b8" opacity="0.62"/>
  </g>

  <g>
    <circle cx="798" cy="230" r="72" fill="#ffffff" opacity="0.92" stroke="#c7d8e5" stroke-width="8"/>
    <text x="798" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#6f8699">ECM</text>
  </g>
</svg>
